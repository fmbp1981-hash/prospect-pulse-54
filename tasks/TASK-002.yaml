  "rollback": "1) Reverter o commit (código não tem outro consumidor até a TASK-003); 2) exportar as tabelas de oposição para scripts/legacy/backup-<data>-opt-out-rpcs.json; 3) rodar supabase/migrations/rollback/20261105120000_contact_opt_out_rpcs.down.sql (só remove as 2 funções; não toca dados); 4) supabase migration repair --status reverted 20261105120000; 5) reverter types.ts e a matriz de function-privileges.",
  "notes": [
    "Decisão de arquitetura (plan 2026-11-05): registro/revogação + evento numa transação exige função no banco; supabase-js não tem transação e service_role não tem DELETE para compensar. Funções SECURITY INVOKER (rodam como service_role, que já tem os grants por coluna), search_path = public, pg_temp, EXECUTE só para service_role, grupo C da matriz.",
    "Sem upsert do supabase-js (INFO-1 da revisão da TASK-001): as funções procuram a linha por (organização, telefone) ou (organização, e-mail) com FOR UPDATE e tratam unique_violation da corrida relendo a linha.",
    "Reaproveitar normalizeBRPhone (src/lib/normalizePhone.ts) na validação; aceitar E.164 internacional já com '+'. O arquivo normalize-contact.ts do /break foi dispensado para não duplicar normalização.",
    "Pedido repetido com a oposição já ativa não grava evento novo (não muda situação); se trouxer identificador que falta na linha (ex.: e-mail), a função o preenche quando não houver outra linha com ele.",
    "Autorização no serviço: registrar = requireWriter ou ator sistema/titular/agente_ia; revogar = requireOrgAdmin (src/lib/auth/require-writer.ts). A organização vem resolvida pelo chamador (rota/job), nunca do corpo da requisição.",
    "Consulta em lote usa três .in() separados (lead_id, phone_e164, email_normalized), nunca .or() com texto: e-mail pode ter vírgula ou parêntese (o CHECK aceita) e quebraria o filtro do PostgREST.",
    "Data confiável da prova: contact_opt_out_events.created_at (INFO-2 da TASK-001).",
    "Dependência formal da TASK-001 removida em 2026-11-05 (decisão do usuário): o código dela está na main (PR #22, e138b1e), mas o framework não reconhece a TASK-001 como satisfeita (fechada por reconciliação manual).",
    "Arquitetura aprovada pelo usuário em 2026-11-05 ('aprovado plano'): duas funções transacionais no banco, 10 arquivos de código/SQL + 2 de evidência."
