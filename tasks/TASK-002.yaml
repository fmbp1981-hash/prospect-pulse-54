  "acceptance_criteria": [
    {
      "id": "AC-001",
      "given": "uma pessoa sem oposição na organização",
      "when": "register é chamado com telefone e/ou e-mail, origem e autor",
      "then": "a oposição fica ativa e um evento opt_out é gravado na mesma transação"
    },
    {
      "id": "AC-002",
      "given": "uma oposição ativa",
      "when": "register é chamado de novo (mesmo telefone em outro formato, ou mesmo e-mail)",
      "then": "não há linha nem evento novos; o resultado diz que nada mudou e a pessoa continua bloqueada"
    },
    {
      "id": "AC-003",
      "given": "um operador ou visualizador",
      "when": "tenta revogar",
      "then": "o serviço recusa antes de chamar o banco (erro de permissão)"
    },
    {
      "id": "AC-004",
      "given": "um admin",
      "when": "revoga sem motivo, com motivo só de espaços ou com mais de 500 caracteres",
      "then": "a revogação é recusada por validação e nada é gravado"
    },
    {
      "id": "AC-005",
      "given": "o mesmo número em formatos diferentes ((11) 99999-0000, +55 11 99999-0000, 011999990000, 5511999990000)",
      "when": "register ou a consulta é feita",
      "then": "todos viram +5511999990000 e o resultado é o mesmo; número que não normaliza é recusado por validação"
    },
    {
      "id": "AC-006",
      "given": "uma oposição revogada",
      "when": "register é chamado de novo",
      "then": "a mesma linha volta a ativa (sem duplicar) e um evento opt_out novo é gravado"
    },
    {
      "id": "AC-007",
      "given": "oposições na organização A",
      "when": "register, revoke ou consulta rodam para a organização B",
      "then": "nada de A é lido nem alterado; revogar id de A informando B dá não encontrado"
    },
    {
      "id": "AC-008",
      "given": "um evento que o banco recusa (ex.: evidence_message_id inválido)",
      "when": "register ou revoke é chamado",
      "then": "a situação da oposição não muda (transação inteira desfeita)"
    },
    {
      "id": "AC-009",
      "given": "as funções novas",
      "when": "anon ou authenticated tentam executá-las",
      "then": "42501; só service_role executa; function-privileges com 0 violações"
    },
    {
      "id": "AC-010",
      "given": "uma lista de destinatários (até 1000)",
      "when": "a consulta em lote é feita",
      "then": "retorna quais estão bloqueados com no máximo 3 consultas (lead_id, telefone, e-mail via .in), sem filtro montado por texto"
    },
    {
      "id": "AC-011",
      "given": "duas chamadas simultâneas de register para o mesmo telefone",
      "when": "ambas rodam",
      "then": "fica uma linha e um evento; a segunda retorna sem mudança"
    }
  ],
