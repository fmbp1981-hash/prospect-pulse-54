      "id": "AC-002",
      "given": "um evento de oposição gravado",
      "when": "authenticated ou service_role tenta UPDATE, DELETE ou TRUNCATE no histórico",
      "then": "a operação é negada (42501)"
    },
    {
      "id": "AC-003",
      "given": "qualquer membro de organização, inclusive admin",
      "when": "tenta INSERT/UPDATE/DELETE direto em contact_opt_outs ou INSERT em contact_opt_out_events",
      "then": "a operação é negada; só service_role grava (e nunca apaga)"
    },
    {
      "id": "AC-004",
      "given": "uma oposição ligada a um lead",
      "when": "o lead é excluído",
      "then": "lead_id vira null e a oposição continua vigente para o mesmo telefone/e-mail"
    },
    {
      "id": "AC-005",
      "given": "o mesmo telefone em A e em B",
