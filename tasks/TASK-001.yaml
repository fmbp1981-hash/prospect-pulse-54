  "rollback": "1) Exportar as duas tabelas para scripts/legacy/backup-<data>-opt-outs.json (git-ignored); 2) rodar supabase/migrations/rollback/20261105100000_contact_opt_outs.down.sql (drop das 2 tabelas, do trigger e da função; nada existente é tocado); 3) reverter types.ts. Enquanto nenhuma task posterior estiver no ar, o rollback não afeta o sistema.",
  "notes": [
    "Schema vivo conferido em 2026-11-04: leads_prospeccao.id é text (FK lead_id text on delete set null); helpers existentes is_org_member, is_org_writer, is_org_admin, is_platform_admin (SECURITY DEFINER com search_path). Não duplicar: linkedin_suppression_list (0 linhas, por linkedin_slug) continua com seu papel; a integração entre as duas fica na TASK-007/item 1.3.",
    "contact_opt_outs: id uuid, organization_id uuid not null (fk organizations on delete cascade), phone_e164 text null CHECK '^\\+[1-9][0-9]{7,14}$', email_normalized text null CHECK (= lower(btrim(...)) e contém @), CHECK ao menos um dos dois, status text CHECK in ('active','revoked'), lead_id text null (fk leads_prospeccao on delete set null), source text CHECK in ('link_email','whatsapp_titular','agente_ia','usuario','importacao') = origem do registro vigente, opted_out_at, revoked_at null, created_at, updated_at (trigger set_updated_at). Índices únicos parciais (organization_id, phone_e164) e (organization_id, email_normalized); índice em lead_id.",
    "contact_opt_out_events: id uuid, organization_id, opt_out_id uuid not null (fk contact_opt_outs on delete cascade), event_type CHECK in ('opt_out','revoke'), source CHECK na mesma lista, actor_type CHECK in ('usuario','agente_ia','titular','sistema'), actor_user_id uuid null (fk auth.users on delete set null), reason text null com CHECK (event_type <> 'revoke' or length(btrim(reason)) >= 3), evidence_message_id text null (id da mensagem; nunca o texto), created_at. Sem updated_at: tabela append-only (exceção documentada à regra created_at/updated_at, como usage_events).",
    "Segurança: ENABLE + FORCE RLS nas duas; policy SELECT to authenticated using (is_org_member(organization_id) or is_platform_admin()); revoke all from public, anon, authenticated; grant select a authenticated; service_role: select/insert/update em contact_opt_outs e só select/insert em contact_opt_out_events (sem delete/truncate em nenhuma). Exclusão só por cascade da organização (RI roda como owner postgres). Sem função SECURITY DEFINER nova.",
    "Normalização (decisão 2026-11-04): E.164 com +55 para 10/11 dígitos sem DDI; e-mail lower+trim. O banco só valida o formato; a normalização em si é da TASK-002.",
