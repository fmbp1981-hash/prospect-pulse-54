# .github/workflows/security.yml
name: DevSecOps Security Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Detectar secrets commitados
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # TODO Sprint 1: tornar bloqueante após triagem do 1º run (2026-10-30)
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  # Job 2: SAST — análise estática de código
  sast-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # TODO Sprint 1: tornar bloqueante após triagem do 1º run (2026-10-30)
    continue-on-error: true
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/typescript --config p/owasp-top-ten --config p/nextjs --error

  # Job 3: SCA — dependências vulneráveis
  sca-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # TODO Sprint 1: tornar bloqueante após triagem do 1º run (2026-10-30)
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with: { sarif_file: "trivy-results.sarif" }
